<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaxSui 后台管理</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, sans-serif; background: #f1f5f9; padding: 2rem; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: white; border-radius: 24px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    h2 { margin-bottom: 1.5rem; display: flex; align-items: center; gap: 8px; }
    label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
    input, textarea { width: 100%; padding: 0.8rem 1rem; border: 1px solid #cbd5e1; border-radius: 16px; font-size: 1rem; margin-bottom: 1rem; font-family: inherit; }
    button { background: #2563eb; color: white; border: none; padding: 0.8rem 2rem; border-radius: 40px; font-weight: 600; cursor: pointer; }
    .logout { background: #64748b; margin-left: 1rem; }
    .status { margin-top: 1rem; color: #10b981; }
    .blog-item, .work-item { border: 1px solid #e2e8f0; border-radius: 20px; padding: 1.2rem; margin-bottom: 1.5rem; background: #f8fafc; }
    .blog-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 600; }
    .blog-header i { transition: transform 0.2s; }
    .blog-body { margin-top: 1rem; display: none; }
    .blog-body.active { display: block; }
    .blog-field { margin-bottom: 1rem; }
    .blog-field label { font-size: 0.9rem; color: #475569; margin-bottom: 0.2rem; }
    .blog-actions { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
    .btn-sm { padding: 0.4rem 1rem; border-radius: 30px; font-size: 0.9rem; }
    .btn-danger { background: #ef4444; color: white; border: none; }
    .hidden { display: none; }
    .login-panel { text-align: center; }
  </style>
</head>
<body>
<div class="container">
  <div id="loginPanel" class="card login-panel">
    <h2>🔐 管理员登录</h2>
    <input type="password" id="adminPassword" placeholder="管理员密码" />
    <button id="loginBtn">登录</button>
    <p id="loginError" style="color: red; margin-top: 1rem;"></p>
  </div>

  <div id="mainPanel" class="hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h1>⚙️ 内容管理</h1>
      <button class="logout" id="logoutBtn">登出</button>
    </div>

    <!-- 个人资料 -->
    <div class="card">
      <h2>👤 个人资料</h2>
      <label>姓名</label>
      <input type="text" id="profileName" />
      <label>简介</label>
      <textarea id="profileBio" rows="3"></textarea>
      <label>年级</label>
      <input type="text" id="profileGrade" />
      <label>年龄</label>
      <input type="number" id="profileAge" />
      <label>兴趣标签（用逗号分隔）</label>
      <input type="text" id="profileInterests" placeholder="C, C++, C#" />
      <label>头像 URL（上传后自动填充）</label>
      <input type="text" id="profileAvatar" />
      <input type="file" id="avatarUpload" accept="image/*" style="margin-top:0.5rem;" />
      <button id="uploadAvatarBtn">上传新头像</button>
      <p id="avatarStatus" class="status"></p>
    </div>

    <!-- 博客管理 -->
    <div class="card">
      <h2>📝 博客文章</h2>
      <div id="blogList" class="blog-editor-container"></div>
      <button id="addBlogBtn" style="margin-top: 1rem;">+ 添加新文章</button>
    </div>

    <!-- 作品管理 -->
    <div class="card">
      <h2>🖼️ 作品展示</h2>
      <div id="workList"></div>
      <button id="addWorkBtn">+ 添加新作品</button>
    </div>

    <!-- 联系方式 -->
    <div class="card">
      <h2>📬 联系方式</h2>
      <label>电子邮箱</label>
      <input type="email" id="contactEmail" />
      <label>微信</label>
      <input type="text" id="contactWechat" />
      <label>QQ</label>
      <input type="text" id="contactQQ" />
    </div>

    <button id="saveAllBtn" style="background: #059669;">💾 保存所有更改</button>
    <p id="saveStatus" class="status"></p>
  </div>
</div>

<script>
  const API_BASE = 'https://maxsui-backbend-production.up.railway.app/api';
  let token = localStorage.getItem('adminToken') || '';
  let profileData = {}, blogData = [], worksData = [], contactData = {};

  const loginPanel = document.getElementById('loginPanel');
  const mainPanel = document.getElementById('mainPanel');

  // 自动登录检查
  if (token) verifyAndLoad();

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const pwd = document.getElementById('adminPassword').value;
    try {
      const res = await fetch(`${API_BASE}/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        localStorage.setItem('adminToken', token);
        await loadSettings();
        loginPanel.classList.add('hidden');
        mainPanel.classList.remove('hidden');
      } else {
        document.getElementById('loginError').innerText = data.error || '登录失败';
      }
    } catch (e) {
      document.getElementById('loginError').innerText = '网络错误';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('adminToken');
    token = '';
    loginPanel.classList.remove('hidden');
    mainPanel.classList.add('hidden');
  });

  async function verifyAndLoad() {
    try {
      const res = await fetch(`${API_BASE}/admin/settings`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.ok) {
        const data = await res.json();
        profileData = data.profile || {};
        blogData = data.blog || [];
        worksData = data.works || [];
        contactData = data.contact || {};
        populateForm();
        loginPanel.classList.add('hidden');
        mainPanel.classList.remove('hidden');
      } else {
        localStorage.removeItem('adminToken');
        token = '';
      }
    } catch (e) { console.error(e); }
  }

  async function loadSettings() {
    const res = await fetch(`${API_BASE}/admin/settings`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const data = await res.json();
    profileData = data.profile || {};
    blogData = data.blog || [];
    worksData = data.works || [];
    contactData = data.contact || {};
    populateForm();
  }

  function populateForm() {
    document.getElementById('profileName').value = profileData.name || '';
    document.getElementById('profileBio').value = profileData.bio || '';
    document.getElementById('profileGrade').value = profileData.grade || '';
    document.getElementById('profileAge').value = profileData.age || '';
    document.getElementById('profileInterests').value = (profileData.interests || []).join(', ');
    document.getElementById('profileAvatar').value = profileData.avatar || '';
    document.getElementById('contactEmail').value = contactData.email || '';
    document.getElementById('contactWechat').value = contactData.wechat || '';
    document.getElementById('contactQQ').value = contactData.qq || '';
    renderBlogList();
    renderWorkList();
  }

  // ---------- 博客编辑（新版，带正文） ----------
  function escapeHtml(text) {
    if (!text) return text;
    return String(text).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[c]);
  }

  function renderBlogList() {
    const container = document.getElementById('blogList');
    if (!blogData.length) {
      container.innerHTML = '<p style="color:#64748b;">暂无文章，点击下方按钮添加</p>';
      return;
    }
    container.innerHTML = blogData.map((post, idx) => {
      const postId = post.id || Date.now() + idx;
      return `
        <div class="blog-item" data-index="${idx}">
          <div class="blog-header" onclick="toggleBlogBody(${idx})">
            <span>📄 ${escapeHtml(post.title) || '未命名文章'}</span>
            <i class="fas fa-chevron-down" id="blog-chevron-${idx}"></i>
          </div>
          <div class="blog-body" id="blog-body-${idx}">
            <div class="blog-field">
              <label>标题</label>
              <input type="text" value="${escapeHtml(post.title) || ''}" data-field="title" data-index="${idx}" placeholder="文章标题">
            </div>
            <div class="blog-field">
              <label>摘要</label>
              <textarea rows="3" data-field="summary" data-index="${idx}" placeholder="简短摘要">${escapeHtml(post.summary) || ''}</textarea>
            </div>
            <div class="blog-field">
              <label>正文内容 (支持 Markdown 或 HTML)</label>
              <textarea rows="6" data-field="content" data-index="${idx}" placeholder="文章完整内容">${escapeHtml(post.content) || ''}</textarea>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
              <div class="blog-field"><label>日期</label><input type="text" value="${post.date || ''}" data-field="date" data-index="${idx}"></div>
              <div class="blog-field"><label>阅读时长</label><input type="text" value="${post.readTime || ''}" data-field="readTime" data-index="${idx}"></div>
            </div>
            <div class="blog-field">
              <label>图标 (Font Awesome 类名)</label>
              <input type="text" value="${post.icon || 'fa-pen'}" data-field="icon" data-index="${idx}">
            </div>
            <div class="blog-actions">
              <button class="btn-sm btn-danger" onclick="deleteBlog(${idx})"><i class="fas fa-trash"></i> 删除</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('[data-field]').forEach(el => {
      el.addEventListener('input', (e) => {
        const idx = e.target.dataset.index;
        const field = e.target.dataset.field;
        if (!blogData[idx]) blogData[idx] = { id: Date.now() + idx };
        blogData[idx][field] = e.target.value;
      });
    });
  }

  window.toggleBlogBody = (idx) => {
    const body = document.getElementById(`blog-body-${idx}`);
    const chevron = document.getElementById(`blog-chevron-${idx}`);
    body.classList.toggle('active');
    chevron.style.transform = body.classList.contains('active') ? 'rotate(180deg)' : 'rotate(0deg)';
  };

  window.deleteBlog = (idx) => {
    if (confirm('确定删除这篇文章吗？')) {
      blogData.splice(idx, 1);
      renderBlogList();
    }
  };

  document.getElementById('addBlogBtn').addEventListener('click', () => {
    const newPost = {
      id: Date.now(),
      title: '新文章',
      summary: '',
      content: '',
      date: new Date().toISOString().split('T')[0],
      readTime: '5 min',
      icon: 'fa-pen'
    };
    blogData.push(newPost);
    renderBlogList();
    setTimeout(() => toggleBlogBody(blogData.length - 1), 50);
  });

  // ---------- 作品管理 ----------
  function renderWorkList() {
    const container = document.getElementById('workList');
    container.innerHTML = worksData.map((work, idx) => `
      <div class="work-item">
        <input value="${escapeHtml(work.name) || ''}" placeholder="名称" data-index="${idx}" data-field="name" />
        <input value="${escapeHtml(work.description) || ''}" placeholder="描述" data-index="${idx}" data-field="description" />
        <input value="${escapeHtml(work.icon) || ''}" placeholder="图标" data-index="${idx}" data-field="icon" />
        <input value="${escapeHtml(work.link) || ''}" placeholder="链接" data-index="${idx}" data-field="link" />
        <button onclick="deleteWork(${idx})">删除</button>
      </div>
    `).join('');
    container.querySelectorAll('[data-field]').forEach(el => {
      el.addEventListener('input', (e) => {
        const idx = e.target.dataset.index;
        const field = e.target.dataset.field;
        if (!worksData[idx]) worksData[idx] = { id: Date.now() + idx };
        worksData[idx][field] = e.target.value;
      });
    });
  }

  window.deleteWork = (idx) => { worksData.splice(idx, 1); renderWorkList(); };
  document.getElementById('addWorkBtn').addEventListener('click', () => {
    worksData.push({ id: Date.now(), name: '新作品', description: '', icon: 'fa-code', link: '#' });
    renderWorkList();
  });

  // ---------- 保存 ----------
  document.getElementById('saveAllBtn').addEventListener('click', async () => {
    const profile = {
      name: document.getElementById('profileName').value,
      bio: document.getElementById('profileBio').value,
      grade: document.getElementById('profileGrade').value,
      age: parseInt(document.getElementById('profileAge').value) || null,
      interests: document.getElementById('profileInterests').value.split(',').map(s => s.trim()).filter(s => s),
      avatar: document.getElementById('profileAvatar').value
    };
    const contact = {
      email: document.getElementById('contactEmail').value,
      wechat: document.getElementById('contactWechat').value,
      qq: document.getElementById('contactQQ').value
    };
    try {
      const res = await fetch(`${API_BASE}/admin/settings`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
        body: JSON.stringify({ profile, blog: blogData, works: worksData, contact })
      });
      if (res.ok) {
        document.getElementById('saveStatus').innerText = '✅ 保存成功！';
      } else {
        document.getElementById('saveStatus').innerText = '❌ 保存失败';
      }
    } catch (e) {
      document.getElementById('saveStatus').innerText = '网络错误';
    }
  });

  // ---------- 头像上传 ----------
  document.getElementById('uploadAvatarBtn').addEventListener('click', async () => {
    const fileInput = document.getElementById('avatarUpload');
    const file = fileInput.files[0];
    if (!file) return alert('请选择图片');
    const formData = new FormData();
    formData.append('avatar', file);
    const statusEl = document.getElementById('avatarStatus');
    statusEl.innerText = '上传中...';
    try {
      const res = await fetch(`${API_BASE}/profile/upload-avatar`, {
        method: 'POST',
        headers: { 'Authorization': `Bearer ${token}` },
        body: formData
      });
      const data = await res.json();
      if (res.ok) {
        document.getElementById('profileAvatar').value = data.avatarUrl;
        statusEl.innerText = '✅ 头像已上传，请点击“保存所有更改”生效';
      } else {
        statusEl.innerText = '❌ 上传失败：' + (data.error || '未知错误');
      }
    } catch (e) {
      statusEl.innerText = '网络错误';
    }
  });
</script>
</body>
</html>
