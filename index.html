<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>隋修梁 MaxSui 个人主页</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- 自定义样式（包含液态玻璃与背景图） -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 顶部导航（液态玻璃） -->
<nav class="glass-nav" id="mainNav">
  <div class="logo">
    <i class="fas fa-terminal"></i>
    <span>MaxSui</span>
  </div>
  <div class="nav-links">
    <a href="#home" class="nav-btn" data-section="home"><i class="fas fa-home"></i><span>主页</span></a>
    <a href="#blog" class="nav-btn" data-section="blog"><i class="fas fa-pen-fade"></i><span>博客</span></a>
    <a href="#works" class="nav-btn" data-section="works"><i class="fas fa-laptop-code"></i><span>我的作品</span></a>
    <a href="#contact" class="nav-btn" data-section="contact"><i class="fas fa-envelope"></i><span>联系我</span></a>
  </div>
</nav>

<!-- 水平滚动容器 -->
<div class="horizontal-scroll-container" id="scrollContainer">
  <!-- 主页 -->
  <section id="home" class="panel">
    <div class="panel-content">
      <div class="hero">
        <div class="hero-content" id="profileContainer">
          <div class="loading-placeholder">加载中...</div>
        </div>
        <div class="hero-avatar" id="avatarContainer"></div>
      </div>
    </div>
  </section>

  <!-- 博客 -->
  <section id="blog" class="panel">
    <div class="panel-content">
      <div class="section-title">
        <i class="fas fa-blog"></i>
        <span>技术随笔</span>
      </div>
      <div class="blog-grid" id="blogGrid">
        <div class="loading-placeholder">正在加载博客文章...</div>
      </div>
    </div>
  </section>

  <!-- 作品 -->
  <section id="works" class="panel">
    <div class="panel-content">
      <div class="section-title">
        <i class="fas fa-flask"></i>
        <span>我的作品</span>
      </div>
      <div class="works-grid" id="worksGrid">
        <div class="loading-placeholder">加载作品...</div>
      </div>
    </div>
  </section>

  <!-- 联系 -->
  <section id="contact" class="panel">
    <div class="panel-content">
      <div class="section-title">
        <i class="fas fa-address-card"></i>
        <span>联系我</span>
      </div>
      <div class="contact-wrapper">
        <div class="contact-info glass-card" id="contactInfoCard">
          <h3><i class="fas fa-message"></i> 联系方式</h3>
          <div id="contactDisplayArea">
            <div class="locked-contact">
              <p><i class="fas fa-lock"></i> 联系方式已隐藏，请输入口令查看</p>
              <div class="password-area">
                <input type="password" id="contactPasswordInput" placeholder="输入口令" />
                <button id="unlockContactBtn" class="unlock-btn"><i class="fas fa-key"></i> 验证</button>
              </div>
              <p class="hint">(演示口令: 1234)</p>
            </div>
          </div>
        </div>
        <div class="contact-form glass-card">
          <h3><i class="fas fa-paper-plane"></i> 快速留言</h3>
          <form id="messageForm">
            <div class="input-group">
              <input type="text" placeholder="你的名字" required>
            </div>
            <div class="input-group">
              <input type="email" placeholder="电子邮箱" required>
            </div>
            <div class="input-group">
              <textarea rows="3" placeholder="想说点什么..."></textarea>
            </div>
            <button type="submit" class="send-btn"><i class="fas fa-paper-plane"></i> 发送讯息</button>
          </form>
          <p class="form-note"><i class="fas fa-shield"></i> 留言会通过后端通知我</p>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="footer">
  <p>© 2026 隋修梁 MaxSui I Can, because I think I can! <i class="fas fa-heart"></i></p>
</div>

<script src="script.js"></script>
</body>
</html>
